name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: Instalar dependências
        run: pip install -e ".[web,pdf,dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Testes
        run: pytest -q
      - name: Diagnóstico
        run: tta doctor

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: texto-to-audio:ci
          build-args: PIPER_VOICES=
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm texto-to-audio:ci tta doctor
          docker run -d --name tta -p 8000:8000 texto-to-audio:ci
          for i in $(seq 1 30); do curl -fs http://localhost:8000/api/health && break; sleep 1; done
          curl -fs http://localhost:8000/api/capabilities > /dev/null
          docker rm -f tta
