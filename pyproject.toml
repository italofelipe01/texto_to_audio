[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "texto-to-audio"
version = "3.0.0"
description = "Pipeline completo de texto para áudio: vozes neurais gratuitas, pós-produção com FFmpeg, legendas, vídeo e interface web."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ítalo Felipe Lira de Morais" }]
requires-python = ">=3.11"
keywords = ["text-to-speech", "tts", "ffmpeg", "audiobook", "podcast", "acessibilidade", "edge-tts", "piper"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Natural Language :: Portuguese (Brazilian)",
]
dependencies = [
    "edge-tts>=7.0",
    "gTTS>=2.5",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]
pdf = ["pypdf>=4.0"]
piper = ["piper-tts>=1.3"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]
all = ["texto-to-audio[web,pdf,piper]"]

[project.scripts]
tta = "texto_to_audio.cli:main"
texto-to-audio = "texto_to_audio.cli:main"

[project.urls]
Homepage = "https://github.com/italofelipe01/texto_to_audio"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
texto_to_audio = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["texto_to_audio"]
known-local-folder = ["conftest"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Depends"]
